name: tabi

services:
  postgres:
    image: postgres:17-alpine
    container_name: tabi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${TABI_POSTGRES_DB:-tabi}"
      POSTGRES_USER: "${TABI_POSTGRES_USER:-tabi}"
      POSTGRES_PASSWORD: "${TABI_POSTGRES_PASSWORD:?Define TABI_POSTGRES_PASSWORD en .env}"
    volumes:
      - tabi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TABI_POSTGRES_USER:-tabi} -d ${TABI_POSTGRES_DB:-tabi}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ghcr.io/matadoreru/tabi:${TABI_IMAGE_TAG:-latest}
    container_name: tabi
    restart: unless-stopped
    environment:
      PORT: "4173"
      TABI_POSTGRES_HOST: postgres
      TABI_POSTGRES_PORT: "5432"
      TABI_POSTGRES_DB: "${TABI_POSTGRES_DB:-tabi}"
      TABI_POSTGRES_USER: "${TABI_POSTGRES_USER:-tabi}"
      TABI_POSTGRES_PASSWORD: "${TABI_POSTGRES_PASSWORD:?Define TABI_POSTGRES_PASSWORD en .env}"
      TABI_POSTGRES_POOL_SIZE: "${TABI_POSTGRES_POOL_SIZE:-10}"
      TABI_GOOGLE_MAPS_API_KEY: "${TABI_GOOGLE_MAPS_API_KEY:-}"
      TABI_GOOGLE_PLACES_API_KEY: "${TABI_GOOGLE_PLACES_API_KEY:-}"
      TABI_GOOGLE_MAPS_MAP_ID: "${TABI_GOOGLE_MAPS_MAP_ID:-}"
      TABI_PUBLIC_ORIGIN: "${TABI_PUBLIC_ORIGIN:-}"
      TABI_SECURE_COOKIE: "${TABI_SECURE_COOKIE:-true}"
      TABI_METRICS_TOKEN: "${TABI_METRICS_TOKEN:-}"
    ports:
      - "127.0.0.1:${TABI_HOST_PORT:-4173}:4173"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    labels:
      - "com.centurylinklabs.watchtower.enable=${TABI_WATCHTOWER_ENABLE:-false}"
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:4173/api/health'); if (!response.ok) Deno.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate-sqlite:
    image: ghcr.io/matadoreru/tabi:${TABI_IMAGE_TAG:-latest}
    profiles: ["migration"]
    restart: "no"
    environment:
      TABI_SQLITE_SOURCE: /legacy/tabi.sqlite
      TABI_POSTGRES_HOST: postgres
      TABI_POSTGRES_PORT: "5432"
      TABI_POSTGRES_DB: "${TABI_POSTGRES_DB:-tabi}"
      TABI_POSTGRES_USER: "${TABI_POSTGRES_USER:-tabi}"
      TABI_POSTGRES_PASSWORD: "${TABI_POSTGRES_PASSWORD:?Define TABI_POSTGRES_PASSWORD en .env}"
      TABI_POSTGRES_POOL_SIZE: "2"
    command:
      - deno
      - task
      - migrate:sqlite
      - /legacy/tabi.sqlite
    volumes:
      - tabi_data:/legacy:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tabi_data:
    name: tabi_data
  tabi_postgres_data:
    name: tabi_postgres_data
