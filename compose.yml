name: tabi

services:
  app:
    image: ghcr.io/matadoreru/tabi:${TABI_IMAGE_TAG:-latest}
    container_name: tabi
    restart: unless-stopped
    environment:
      DENO_DIR: /tmp/deno-dir
      PORT: "4173"
      TABI_DATABASE_PATH: /app/data/tabi.sqlite
      TABI_GOOGLE_MAPS_API_KEY: "${TABI_GOOGLE_MAPS_API_KEY:-}"
      TABI_GOOGLE_MAPS_MAP_ID: "${TABI_GOOGLE_MAPS_MAP_ID:-}"
      TABI_PUBLIC_ORIGIN: "${TABI_PUBLIC_ORIGIN:-}"
      TABI_SECURE_COOKIE: "${TABI_SECURE_COOKIE:-true}"
    ports:
      - "127.0.0.1:${TABI_HOST_PORT:-4173}:4173"
    volumes:
      - tabi_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:4173/api/health'); if (!response.ok) Deno.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tabi_data:
    name: tabi_data
