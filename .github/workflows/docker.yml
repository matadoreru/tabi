name: Validate and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Tabi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tabi_test
          POSTGRES_USER: tabi_test
          POSTGRES_PASSWORD: tabi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabi_test -d tabi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TABI_POSTGRES_HOST: 127.0.0.1
      TABI_POSTGRES_PORT: 5432
      TABI_POSTGRES_DB: tabi_test
      TABI_POSTGRES_USER: tabi_test
      TABI_POSTGRES_PASSWORD: tabi_test_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Check formatting
        run: deno task format:check

      - name: Lint
        run: deno task lint

      - name: Type and module check
        run: deno task check

      - name: Test
        run: deno task test

  publish:
    name: Build and publish GHCR image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TABI_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/matadoreru/tabi:latest
            ghcr.io/matadoreru/tabi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
